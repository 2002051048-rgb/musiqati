<button id="upBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</button>

<script>
  const myButton = document.getElementById("upBtn");
  window.onscroll = () => {
    if (window.scrollY > 300) {
      myButton.style.display = "block";
    } else {
      myButton.style.display = "none";
    }
  };
</script>
